{% extends "admin/base_admin.html" %}
{% block title %}Cargar equipos{% endblock %}
{% block page_title %}Cargar equipos{% endblock %}
{% block page_sub %}Un equipo por categoría de cada club.{% endblock %}

{% block content %}
<div class="ad-card">
      <form class="ad-form" method="POST" action="{{ url_for('views.cargar_equipos') }}">

        <div class="ad-field">
          <label for="club_id">Club</label>
          <select id="club_id" name="club_id" required>
            <option value="">Seleccione un club...</option>
            {% for c in clubes %}
              <option value="{{ c.id }}"
                {% if club_seleccionado and club_seleccionado == c.id %}selected{% endif %}>
                {{ c.nombre }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="ad-field">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria" required>
            <option value="">Seleccione la categoría...</option>
            <option value="Primera">Primera</option>
            <option value="Reserva">Reserva</option>
            <option value="Quinta">Quinta</option>
            <option value="Sexta">Sexta</option>
            <option value="Septima">Séptima</option>
          </select>
        </div>

        <div class="ad-form-acciones">
          <button type="submit" class="ad-btn ad-btn-primario">Guardar Equipo</button>
        </div>

      </form>
    </div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function () {

      const clubSelect      = document.getElementById("club_id");
      const categoriaSelect = document.getElementById("categoria");

      function filtrarCategorias(clubId) {
        for (let opt of categoriaSelect.options) {
          opt.hidden   = false;
          opt.disabled = false;
        }
        if (!clubId) return;

        fetch(`/categorias_cargadas/${clubId}`)
          .then(response => response.json())
          .then(cargadas => {
            for (let opt of categoriaSelect.options) {
              if (cargadas.includes(opt.value)) {
                opt.hidden = true;
              }
            }
            categoriaSelect.value = "";
          });
      }

      clubSelect.addEventListener("change", function () {
        filtrarCategorias(this.value);
      });

      if (clubSelect.value) {
        filtrarCategorias(clubSelect.value);
      }

      // Flash animations
      const flashes = document.querySelectorAll(".flash-message");
      flashes.forEach(flash => {
        setTimeout(() => {
          flash.style.opacity = 1;
          flash.style.transform = "translateY(0)";
        }, 100);
        setTimeout(() => {
          flash.style.opacity = 0;
          flash.style.transform = "translateY(-12px)";
          setTimeout(() => flash.remove(), 400);
        }, 3000);
      });

    });
  </script>
{% endblock %}
