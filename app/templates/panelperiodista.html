<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Panel del Periodista — LIF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --border:    rgba(255,255,255,0.07);
      --accent:    #00e5ff;
      --accent2:   #7c3aed;
      --text:      #e8e8f0;
      --muted:     #6b6b80;
      --card-bg:   #13131c;
      --card-hover:#181825;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── NOISE TEXTURE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: .5;
    }

    /* ── AMBIENT GLOW ── */
    body::after {
      content: '';
      position: fixed;
      width: 700px; height: 700px;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(0,229,255,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── TOPBAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2.5rem;
      height: 64px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,14,20,.9);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-mark {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      opacity: .6;
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .btn-nav {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 20px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all .25s ease;
      letter-spacing: .3px;
    }

    .btn-nav:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,229,255,.06);
    }

    .btn-nav .icon { font-style: normal; font-size: 1rem; }

    /* ── WRAPPER ── */
    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 1360px;
      margin: 0 auto;
      padding: 0 32px 80px;
    }

    /* ── HERO HEADER ── */
    .hero {
      margin-bottom: 72px;
      padding-top: 52px;
    }

    .hero-eyebrow {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      opacity: .7;
      margin-bottom: 16px;
    }

    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2.4rem, 5vw, 4rem);
      color: var(--text);
      line-height: 1.05;
      letter-spacing: -1.5px;
    }

    .hero h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── SECTION ── */
    .section { margin-bottom: 56px; }

    .section-label {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .section-label .label-icon {
      font-size: 1rem;
      width: 34px; height: 34px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .section-label h2 {
      font-family: 'Syne', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-label .divider {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── GRID ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    /* ── CARD ── */
    .card-link {
      text-decoration: none;
      display: block;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      position: relative;
      overflow: hidden;
      transition: transform .3s cubic-bezier(.22,.68,0,1.2),
                  background .25s ease,
                  border-color .25s ease,
                  box-shadow .3s ease;
      cursor: pointer;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 100px; height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,229,255,.18) 0%, transparent 70%);
      opacity: 0;
      transition: opacity .35s ease;
    }

    .card-link:hover .card::before { opacity: 1; }

    .card-link:hover .card {
      transform: translateY(-5px) scale(1.01);
      background: var(--card-hover);
      border-color: rgba(0,229,255,.25);
      box-shadow: 0 20px 50px rgba(0,0,0,.4), 0 0 0 1px rgba(0,229,255,.1);
    }

    .card-number {
      font-family: 'Syne', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(0,229,255,.3);
      margin-bottom: 14px;
      transition: color .25s;
    }

    .card-link:hover .card-number { color: rgba(0,229,255,.65); }

    .card h3 {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      letter-spacing: -.2px;
      transition: color .25s;
    }

    .card-link:hover .card h3 { color: #fff; }

    .card-arrow {
      position: absolute;
      top: 24px; right: 24px;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      color: var(--muted);
      transition: all .3s ease;
    }

    .card-link:hover .card-arrow {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,229,255,.08);
      transform: rotate(45deg);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-link {
      animation: fadeUp .5s ease both;
    }

    @media (max-width: 640px) {
      .wrapper { padding: 0 18px 60px; }
      .hero h1 { letter-spacing: -1px; }
      .card-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
      .topbar { flex-direction: column; gap: 16px; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <span class="logo-mark">Periodista</span>
    <div class="top-actions">
      <a href="{{ url_for('views.index') }}" class="btn-nav">
        <i class="icon">⌂</i> Inicio
      </a>
      <a href="{{ url_for('views.logout') }}" class="btn-nav">
        <i class="icon">→</i> Cerrar Sesión
      </a>
    </div>
  </header>

  <div class="wrapper">

    <!-- HERO -->
    <div class="hero">
      <p class="hero-eyebrow">Acceso restringido</p>
      <h1>Panel del<br><span>Periodista</span></h1>
    </div>

    <!-- SECCIÓN: Gestión de contenido -->
    <section class="section">
      <div class="section-label">
        <span class="label-icon">✍️</span>
        <h2>Gestión de contenido</h2>
        <div class="divider"></div>
      </div>
      <div class="card-grid">

        <a href="{{ url_for('views.cargar_noticia') }}" class="card-link" style="animation-delay:.05s">
          <div class="card">
            <div class="card-arrow">↗</div>
            <div class="card-number">01</div>
            <h3>Cargar Noticias</h3>
          </div>
        </a>

        <a href="{{ url_for('views.cargar_video') }}" class="card-link" style="animation-delay:.10s">
          <div class="card">
            <div class="card-arrow">↗</div>
            <div class="card-number">02</div>
            <h3>Cargar Videos</h3>
          </div>
        </a>

      </div>
    </section>

  </div>

</body>
</html>
